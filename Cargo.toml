[package]
name = "tracing-fastly"
version = "0.1.0"
edition = "2024"

[dependencies]
fastly = "0.13.0"
fastly-shared = "0.13.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.137"
serde_with = "3.21.0"
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3.16", default-features = false, features = ["fmt", "json", "env-filter"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
test-case = "3.3.1"
tracing-test = "0.2.5"
